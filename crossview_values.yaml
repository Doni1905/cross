---
# Default values for crossview
# This is a YAML-formatted file.

# Global settings
global:
  namespace: crossview
  createNamespace: true

# Image configuration
image:
  repository: ghcr.io/crossplane-contrib/crossview
  pullPolicy: Always
  tag: ""
  platform: ""

# Application configuration
app:
  name: crossview
  port: 3001
  replicas: 1
  automountServiceAccountToken: null
  # IMPORTANT: do NOT inject DB_HOST via extraEnv. The chart already renders a
  # DB_HOST env from the ConfigMap; a second DB_HOST here collides on apply
  # ("may not have more than one field specified at a time"). The host is synced
  # into the secret prod-crossview-secrets (key: host) for reference/consistency,
  # but the app consumes it through config.database.host below.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

# Deployment strategy
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# Resource limits and requests
# Defaults are set for typical clusters. If the pod is OOMKilled when opening the dashboard,
# increase memory (e.g. 1Gi–2Gi); see docs/TROUBLESHOOTING.md#oomkilled-when-opening-the-dashboard.
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # NOTE on readiness: the app's /api/health endpoint is a STATIC handler that
  # always returns {"status":"ok"} (see crossview-go-server/api/routes/health.go).
  # It does NOT test the database, so a broken DB_HOST / unreachable RDS would
  # otherwise leave the pod "Ready" while the app can't actually talk to Postgres.
  #
  # This exec readiness probe adds a DB reachability check. The image is Alpine
  # with `nc` but NO psql/pg_isready, so this is a TCP-reachability check only:
  # it confirms the pod can open a socket to $DB_HOST:$DB_PORT (the resolved RDS
  # endpoint), plus that the app HTTP port is serving. It does NOT validate DB
  # credentials or that the `crossview` database exists -- that would require a
  # Postgres client in the image or an upstream /api/ready endpoint.
  #
  # It is on readiness (not liveness) on purpose: a transient RDS blip pulls the
  # pod out of Service rotation and it recovers automatically, rather than
  # crash-looping the container.
  readinessProbe:
    # Explicitly null the chart's default httpGet handler. Helm deep-merges this
    # map with the chart's values.yaml (which sets readinessProbe.httpGet), and a
    # probe with BOTH exec and httpGet is rejected by Kubernetes. Nulling it here
    # ensures the merged probe has only the exec handler below.
    httpGet: null
    exec:
      command:
        - /bin/sh
        - -c
        - >-
          wget -q -O /dev/null "http://127.0.0.1:${PORT:-3001}/api/health"
          && nc -z -w3 "$DB_HOST" "${DB_PORT:-5432}"
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  sessionAffinity: ClientIP
  sessionAffinityTimeout: 10800
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: crossview.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API configuration (alternative to ingress)
# Requires the Gateway API CRDs and a Gateway controller installed in the cluster.
# The chart renders an HTTPRoute that attaches to an existing Gateway via parentRefs.
gatewayAPI:
  enabled: false
  httpRoute:
    # apiVersion of the HTTPRoute resource. Override for older controllers (e.g. v1beta1).
    apiVersion: gateway.networking.k8s.io/v1
    annotations: {}
    labels: {}
    # Gateway(s) this route attaches to. name is required; the rest are optional.
    parentRefs:
      - name: gateway
        # namespace: gateway-system
        # sectionName: https
        # port: 443
    # Hostnames this route matches. Leave empty to match all hostnames on the Gateway.
    hostnames:
      - crossview.example.com
    # Routing rules. Each rule may override matches, filters, backendRefs and timeouts.
    # Defaults: a single PathPrefix "/" match routed to the crossview service.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database configuration
# Bundled in-cluster Postgres is DISABLED: CrossView uses an external AWS RDS
# instance instead (see config.database below). Leaving this true would deploy a
# postgres:latest pod + 10Gi PVC that we do not want.
database:
  enabled: false
  image:
    repository: postgres
    tag: "latest"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# Configuration
config:
  ref: ""
  database:
    enabled: true
    # RDS endpoint is NOT hardcoded here. The literal "$(DB_HOST)" is written
    # verbatim into the crossview-config ConfigMap (chart 4.6.0 renders
    #   DB_HOST: {{ .Values.config.database.host | quote }} ), and the CrossView
    # app resolves the $(...) placeholder at startup against the `host` value it
    # reads from the prod-crossview-secrets secret (synced from Secrets Manager
    # prod/devops/crossview by the ExternalSecret below, key: host).
    #
    # NOTE: this is APP-LEVEL interpolation, not Kubernetes env substitution and
    # not a ConfigMap reading a secret (neither of those can resolve a
    # self-referential $(DB_HOST)). It works today, but it depends on the app
    # keeping that behavior. If DB_HOST ever shows up literally as "$(DB_HOST)"
    # inside the pod, replace this with the plain RDS endpoint string instead.
    # The real endpoint therefore lives only in Secrets Manager, not in git.
    host: "$(DB_HOST)"
    port: 5432
    database: crossview
    # Dedicated least-privilege app role (owns the crossview DB); NOT the RDS
    # master user. Its password lives in Secrets Manager prod/devops/crossview
    # under db-password (synced via the ExternalSecret below).
    username: crossview
    ssl:
        # RDS enforces TLS in this platform; verify against the AWS global CA
        # bundle (see the nexus rds-ca-bundle pattern for mounting global-bundle.pem).
        mode: require
        rootCert: ""
        cert: ""
        key: ""
  server:
    port: 3001
    # Optional short labels for kube contexts shown in UI badges.
    # Example: { kind-kind: KIND, dev-cluster: DEV }
    contextAliases: {}
    auth:
      mode: session
      trustedHeader: X-Auth-User
      createUsers: true
      defaultRole: viewer
    log:
      level: info
    cors:
      # Public root URL of this Crossview instance (no trailing slash).
      # IMPORTANT: Change this to your actual ingress host in production.
      # This value is used as the post-SSO-login redirect destination. If left
      # as localhost, users will be redirected to localhost after SSO authentication.
      origin: http://localhost:5173
      credentials: true
    session:
      cookie:
        secure: false
        httpOnly: true
        maxAge: 86400000

  # SSO configuration (example values provided, but SSO is disabled by default)
  # sso:
  #   oidc:
  #     enabled: true
  #     issuer: http://localhost:8080/realms/crossview
  #     clientId: crossview-client
  #     authorizationURL: ""
  #     tokenURL: ""
  #     userInfoURL: ""
  #     callbackURL: http://localhost:3001/api/auth/oidc/callback
  #     scope: openid profile email
  #     usernameAttribute: preferred_username
  #     emailAttribute: email
  #     firstNameAttribute: given_name
  #     lastNameAttribute: family_name
  #   saml:
  #     enabled: true
  #     entryPoint: http://localhost:8080/realms/crossview/protocol/saml
  #     issuer: crossview
  #     callbackURL: http://localhost:3001/api/auth/saml/callback
  #     usernameAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
  #     emailAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
  #     firstNameAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname
  #     lastNameAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname
  sso:
    oidc:
      enabled: false
    saml:
      enabled: false

  vite:
    server:
      proxy:
        api:
          target: http://localhost:3001
          changeOrigin: true

# Secrets configuration
# - Plain string: chart creates a secret with that value
# - Object with secretKeyRef: references an existing secret (no creation)
secrets:
  adminUsername: "admin"
  # Admin password is fetched from AWS Secrets Manager (via the ExternalSecret in
  # extraManifests below) into the k8s secret `prod-crossview-secrets`, same as
  # dbPassword. Never commit a plaintext admin password.
  adminPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: admin-password
  # RDS password is fetched from AWS Secrets Manager (via the ExternalSecret in
  # extraManifests below) into the k8s secret `prod-crossview-secrets`. Pod Identity
  # is only the pipeline that lets ESO read Secrets Manager; CrossView receives a
  # plain password string, so no RDS IAM token handling is needed.
  # NOTE: the secret MUST exist before the pod starts, or the pod blocks on
  # CreateContainerConfigError. The sync-wave annotation on the ExternalSecret
  # orders its creation ahead of the Deployment.
  dbPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: db-password
  # RDS endpoint, synced from Secrets Manager (prod/devops/crossview -> host) into
  # prod-crossview-secrets by the ExternalSecret below. This is the source the app
  # uses to resolve the "$(DB_HOST)" placeholder in config.database.host above, so
  # the real endpoint stays out of git. NOTE: the crossview chart 4.6.0 does not
  # define its own handling for `dbHost`, so this block is only meaningful because
  # the app reads the `host` key from the secret directly.
  dbHost:
    secretKeyRef:
      name: prod-crossview-secrets
      key: host
  sessionSecret: ""
  OIDCClientSecret: ""
  SAMLCert: ""

  # Production override example: use existing secrets instead of chart-created ones
  # dbPassword:
  #   secretKeyRef:
  #     name: prod-crossview-secrets
  #     key: db-password
  # sessionSecret:
  #   secretKeyRef:
  #     name: prod-crossview-secrets
  #     key: session-secret
  # OIDCClientSecret:
  #   secretKeyRef:
  #     name: oidc-credentials
  #     key: client-secret

# Service Account
serviceAccount:
  create: true
  name: crossview-sa
  annotations: {}

# RBAC
rbac:
  create: true
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

# Pod affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - crossview
          topologyKey: kubernetes.io/hostname

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Pod annotations (applied to app pods)
podAnnotations: {}

# Pod labels (applied to app pods)
podLabels: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

# Extra manifests
# ExternalSecret that syncs the RDS password from AWS Secrets Manager into the
# k8s secret `prod-crossview-secrets`, referenced by secrets.dbPassword above.
# Mirrors the twingate-connector ExternalSecret pattern (ClusterSecretStore
# `aws-cluster-secretstore`). The sync-wave "-1" makes ArgoCD create this (and thus
# ESO create the secret) before the CrossView Deployment (default wave 0), avoiding
# CreateContainerConfigError on first sync.
# remoteRef.key is the Secrets Manager secret path: prod/devops/crossview
# (holds host, db-password and admin-password). The host is synced into the secret
# for reference, but the app consumes it via config.database.host (NOT as an env,
# which would collide with the chart's DB_HOST). extraManifests items must be YAML
# strings (see chart values.schema.json), hence the "|-" block below.
extraManifests:
  - |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: prod-crossview-secrets
      namespace: crossview
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: aws-cluster-secretstore
        kind: ClusterSecretStore
      target:
        name: prod-crossview-secrets
        creationPolicy: Owner
      data:
        - secretKey: host
          remoteRef:
            key: prod/devops/crossview
            property: host
        - secretKey: db-password
          remoteRef:
            key: prod/devops/crossview
            property: db-password
        - secretKey: admin-password
          remoteRef:
            key: prod/devops/crossview
            property: admin-password
# Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  sessionAffinity: ClientIP
  sessionAffinityTimeout: 10800
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: ://example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API configuration
gatewayAPI:
  enabled: false
  httpRoute:
    apiVersion: gateway.networking.k8s.io/v1
    annotations: {}
    labels: {}
    parentRefs:
      - name: gateway
    hostnames:
      - ://example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database configuration
database:
  enabled: false
  image:
    repository: postgres
    tag: "latest"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# Configuration
config:
  ref: ""
  database:
    enabled: true
    # Tells the ConfigMap to extract the text string directly from the secret 
    # created during Argo's sync wave -1. This avoids the extraEnv collision entirely.
    host: "$(DB_HOST)" 
    port: 5432
    database: crossview
    username: crossview
    ssl:
        mode: require
        rootCert: ""
        cert: ""
        key: ""
  server:
    port: 3001
    contextAliases: {}
    auth:
      mode: session
      trustedHeader: X-Auth-User
      createUsers: true
      defaultRole: viewer
    log:
      level: info
    cors:
      origin: http://localhost:5173
      credentials: true
    session:
      cookie:
        secure: false
        httpOnly: true
        maxAge: 86400000

  sso:
    oidc:
      enabled: false
    saml:
      enabled: false

  vite:
    server:
      proxy:
        api:
          target: http://localhost:3001
          changeOrigin: true

# Secrets configuration
secrets:
  adminUsername: "admin"
  adminPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: admin-password
  dbPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: db-password
  # Feeds the correct secret payload string to resolve the host string safely.
  dbHost:
    secretKeyRef:
      name: prod-crossview-secrets
      key: host

# Service Account
serviceAccount:
  create: true
  name: crossview-sa
  annotations: {}

# RBAC
rbac:
  create: true
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

# Pod affinity
