---
# Default values for crossview
# This is a YAML-formatted file.

# Global settings
global:
  namespace: crossview
  createNamespace: true

# Image configuration
image:
  repository: ghcr.io/crossplane-contrib/crossview
  pullPolicy: Always
  tag: ""
  platform: ""

# Application configuration
app:
  name: crossview
  port: 3001
  replicas: 1
  automountServiceAccountToken: null
  # DB_HOST is injected from the k8s secret prod-crossview-secrets (key: host)
  # instead of config.database.host, which the chart only accepts as a plain
  # string. The chart appends app.extraEnv AFTER the ConfigMap-sourced env vars,
  # so this DB_HOST overrides the (empty) ConfigMap one.
  extraEnv:
    - name: DB_HOST
      valueFrom:
        secretKeyRef:
          name: prod-crossview-secrets
          key: host
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

# Deployment strategy
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# Resource limits and requests
# Defaults are set for typical clusters. If the pod is OOMKilled when opening the dashboard,
# increase memory (e.g. 1Gi–2Gi); see docs/TROUBLESHOOTING.md#oomkilled-when-opening-the-dashboard.
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  sessionAffinity: ClientIP
  sessionAffinityTimeout: 10800
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: crossview.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API configuration (alternative to ingress)
# Requires the Gateway API CRDs and a Gateway controller installed in the cluster.
# The chart renders an HTTPRoute that attaches to an existing Gateway via parentRefs.
gatewayAPI:
  enabled: false
  httpRoute:
    # apiVersion of the HTTPRoute resource. Override for older controllers (e.g. v1beta1).
    apiVersion: gateway.networking.k8s.io/v1
    annotations: {}
    labels: {}
    # Gateway(s) this route attaches to. name is required; the rest are optional.
    parentRefs:
      - name: gateway
        # namespace: gateway-system
        # sectionName: https
        # port: 443
    # Hostnames this route matches. Leave empty to match all hostnames on the Gateway.
    hostnames:
      - crossview.example.com
    # Routing rules. Each rule may override matches, filters, backendRefs and timeouts.
    # Defaults: a single PathPrefix "/" match routed to the crossview service.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database configuration
# Bundled in-cluster Postgres is DISABLED: CrossView uses an external AWS RDS
# instance instead (see config.database below). Leaving this true would deploy a
# postgres:latest pod + 10Gi PVC that we do not want.
database:
  enabled: false
  image:
    repository: postgres
    tag: "latest"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# Configuration
config:
  ref: ""
  database:
    enabled: true
    # External AWS RDS (Aurora PostgreSQL) CLUSTER WRITER endpoint.
    # Left empty on purpose: DB_HOST is injected from the k8s secret
    # `prod-crossview-secrets` (key: host) via app.extraEnv below, which the chart
    # appends AFTER the ConfigMap env so it wins. The secret is populated from
    # Secrets Manager (property: host) by the ExternalSecret.
    host: ""
    port: 5432
    database: crossview
    # Dedicated least-privilege app role (owns the crossview DB); NOT the RDS
    # master user. Its password lives in Secrets Manager prod/devops/crossview
    # under db-password (synced via the ExternalSecret below).
    username: crossview
    ssl:
        # RDS enforces TLS in this platform; verify against the AWS global CA
        # bundle (see the nexus rds-ca-bundle pattern for mounting global-bundle.pem).
        mode: require
        rootCert: ""
        cert: ""
        key: ""
  server:
    port: 3001
    # Optional short labels for kube contexts shown in UI badges.
    # Example: { kind-kind: KIND, dev-cluster: DEV }
    contextAliases: {}
    auth:
      mode: session
      trustedHeader: X-Auth-User
      createUsers: true
      defaultRole: viewer
    log:
      level: info
    cors:
      # Public root URL of this Crossview instance (no trailing slash).
      # IMPORTANT: Change this to your actual ingress host in production.
      # This value is used as the post-SSO-login redirect destination. If left
      # as localhost, users will be redirected to localhost after SSO authentication.
      origin: http://localhost:5173
      credentials: true
    session:
      cookie:
        secure: false
        httpOnly: true
        maxAge: 86400000

  # SSO configuration (example values provided, but SSO is disabled by default)
  # sso:
  #   oidc:
  #     enabled: true
  #     issuer: http://localhost:8080/realms/crossview
  #     clientId: crossview-client
  #     authorizationURL: ""
  #     tokenURL: ""
  #     userInfoURL: ""
  #     callbackURL: http://localhost:3001/api/auth/oidc/callback
  #     scope: openid profile email
  #     usernameAttribute: preferred_username
  #     emailAttribute: email
  #     firstNameAttribute: given_name
  #     lastNameAttribute: family_name
  #   saml:
  #     enabled: true
  #     entryPoint: http://localhost:8080/realms/crossview/protocol/saml
  #     issuer: crossview
  #     callbackURL: http://localhost:3001/api/auth/saml/callback
  #     usernameAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
  #     emailAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
  #     firstNameAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname
  #     lastNameAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname
  sso:
    oidc:
      enabled: false
    saml:
      enabled: false

  vite:
    server:
      proxy:
        api:
          target: http://localhost:3001
          changeOrigin: true

# Secrets configuration
# - Plain string: chart creates a secret with that value
# - Object with secretKeyRef: references an existing secret (no creation)
secrets:
  adminUsername: "admin"
  # Admin password is fetched from AWS Secrets Manager (via the ExternalSecret in
  # extraManifests below) into the k8s secret `prod-crossview-secrets`, same as
  # dbPassword. Never commit a plaintext admin password.
  adminPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: admin-password
  # RDS password is fetched from AWS Secrets Manager (via the ExternalSecret in
  # extraManifests below) into the k8s secret `prod-crossview-secrets`. Pod Identity
  # is only the pipeline that lets ESO read Secrets Manager; CrossView receives a
  # plain password string, so no RDS IAM token handling is needed.
  # NOTE: the secret MUST exist before the pod starts, or the pod blocks on
  # CreateContainerConfigError. The sync-wave annotation on the ExternalSecret
  # orders its creation ahead of the Deployment.
  dbPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: db-password
  sessionSecret: ""
  OIDCClientSecret: ""
  SAMLCert: ""

  # Production override example: use existing secrets instead of chart-created ones
  # dbPassword:
  #   secretKeyRef:
  #     name: prod-crossview-secrets
  #     key: db-password
  # sessionSecret:
  #   secretKeyRef:
  #     name: prod-crossview-secrets
  #     key: session-secret
  # OIDCClientSecret:
  #   secretKeyRef:
  #     name: oidc-credentials
  #     key: client-secret

# Service Account
serviceAccount:
  create: true
  name: crossview-sa
  annotations: {}

# RBAC
rbac:
  create: true
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

# Pod affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - crossview
          topologyKey: kubernetes.io/hostname

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Pod annotations (applied to app pods)
podAnnotations: {}

# Pod labels (applied to app pods)
podLabels: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

# Extra manifests
# ExternalSecret that syncs the RDS password from AWS Secrets Manager into the
# k8s secret `prod-crossview-secrets`, referenced by secrets.dbPassword above.
# Mirrors the twingate-connector ExternalSecret pattern (ClusterSecretStore
# `aws-cluster-secretstore`). The sync-wave "-1" makes ArgoCD create this (and thus
# ESO create the secret) before the CrossView Deployment (default wave 0), avoiding
# CreateContainerConfigError on first sync.
# remoteRef.key is the Secrets Manager secret path: prod/devops/crossview
# (holds host, db-password and admin-password). extraManifests items must be YAML
# strings (see chart values.schema.json), hence the "|-" block below.
extraManifests:
  - |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: prod-crossview-secrets
      namespace: crossview
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: aws-cluster-secretstore
        kind: ClusterSecretStore
      target:
        name: prod-crossview-secrets
        creationPolicy: Owner
      data:
        - secretKey: host
          remoteRef:
            key: prod/devops/crossview
            property: host
        - secretKey: db-password
          remoteRef:
            key: prod/devops/crossview
            property: db-password
        - secretKey: admin-password
          remoteRef:
            key: prod/devops/crossview
            property: admin-password
