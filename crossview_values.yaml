# Default values for crossview — MULTI-CLUSTER via token-refresher.
#
# Architecture (see multi-cluster/README.md for full detail):
#   - The Crossview IMAGE (alpine + Go binary) has NO aws CLI, so kubeconfig `exec` auth
#     (aws eks get-token) cannot run in the Crossview pod.
#   - Instead a small SEPARATE Deployment (crossview-token-refresher, image amazon/aws-cli)
#     runs `aws eks get-token` for each remote cluster every ~10 min and writes the tokens
#     into Secret `crossview-remote-tokens` via the local Kubernetes REST API (curl +
#     its own ServiceAccount token — NO kubectl needed).
#   - The refresher's ServiceAccount (crossview-token-refresher) has an EKS Pod Identity
#     association to IAM role CrossviewPodIdentityRole (eks:DescribeCluster + get-token),
#     and access entries (AmazonEKSViewPolicy) on each remote cluster.
#   - Crossview mounts a kubeconfig ConfigMap (endpoints + CA data, no secrets) whose
#     remote users reference tokenFile: /tokens/c2 and /tokens/c3. It reads every context
#     and renders the multi-cluster switcher (gate test PASSED).
#
# GATE PASSED: Crossview 4.6.0 lists all contexts from a mounted multi-context kubeconfig.
#
# ==> FILL IN the CLUSTER_2 / CLUSTER_3 names, endpoints and CA data below (search PLACEHOLDER).
#     Run multi-cluster/collect-cluster-facts.sh to gather them.

# Global settings
global:
  namespace: crossview
  createNamespace: true

# Image configuration
image:
  repository: ghcr.io/crossplane-contrib/crossview
  pullPolicy: Always
  tag: ""
  platform: ""

# Application configuration
app:
  name: crossview
  port: 3001
  replicas: 1
  # Multi-cluster mode: do NOT project the in-cluster ServiceAccount token. Crossview
  # decides in-cluster vs multi-cluster by checking whether the SA token file exists
  # (see kubernetes_context.go isInCluster()). With the token absent it uses KUBECONFIG,
  # which is what enables the switcher. cluster-1 (the local cluster) is therefore also
  # reached via a refreshed token file (/tokens/c1), NOT the in-cluster SA.
  automountServiceAccountToken: false
  extraEnv:
    - name: KUBECONFIG
      value: /kube/config
  extraVolumes:
    # Kubeconfig (endpoints + CA data, no secrets) from the ConfigMap in extraManifests.
    - name: kubeconfig
      configMap:
        name: crossview-kubeconfig
    # Remote (and local) cluster tokens, refreshed by the token-refresher Deployment.
    - name: remote-tokens
      secret:
        secretName: crossview-remote-tokens
  extraVolumeMounts:
    - name: kubeconfig
      mountPath: /kube
      readOnly: true
    - name: remote-tokens
      mountPath: /tokens
      readOnly: true
  extraInitContainers: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

# Deployment strategy
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# Resource limits and requests
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  sessionAffinity: ClientIP
  sessionAffinityTimeout: 10800
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: crossview.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API configuration
gatewayAPI:
  enabled: false
  httpRoute:
    apiVersion: gateway.networking.k8s.io/v1
    annotations: {}
    labels: {}
    parentRefs:
      - name: gateway
    hostnames:
      - crossview.example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database configuration
database:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# Configuration
config:
  ref: ""
  database:
    enabled: true
    host: "crossview-postgres"
    port: 5432
    database: crossview
    username: postgres
    ssl:
      mode: disable
      rootCert: ""
      cert: ""
      key: ""
  server:
    port: 3001
    # UI labels for the switcher. Keys MUST match the kubeconfig context names below.
    contextAliases:
      cluster-1: C1
      cluster-2: C2
      cluster-3: C3
    auth:
      mode: session
      trustedHeader: X-Auth-User
      createUsers: true
      defaultRole: viewer
    log:
      level: info
    cors:
      origin: http://localhost:5173
      credentials: true
    session:
      cookie:
        secure: false
        httpOnly: true
        maxAge: 86400000

  sso:
    oidc:
      enabled: false
    saml:
      enabled: false

  vite:
    server:
      proxy:
        api:
          target: http://localhost:3001
          changeOrigin: true

# Secrets configuration — admin/db passwords from ESO-managed Secret prod-crossview-secrets.
secrets:
  adminUsername: "admin"
  adminPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: admin-password
  dbPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: db-password

# Service Account
# The Crossview pod itself needs no AWS/cluster identity (it authenticates to every
# cluster via the refreshed token files). Keep the default SA, token automount off.
serviceAccount:
  create: false
  name: ""
  annotations: {}

# RBAC — not needed for the Crossview pod (cluster access is via kubeconfig token files).
rbac:
  create: false
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

# Pod affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - crossview
          topologyKey: kubernetes.io/hostname

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

# ============================================================================
# extraManifests: everything the token-refresher model needs, delivered via the chart.
# ============================================================================
extraManifests:
  # ---- App credentials (admin + db passwords), pulled by ESO via Pod Identity ---------
  - |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: prod-crossview-secrets
      namespace: crossview
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "1h"
      secretStoreRef:
        name: aws-cluster-secretstore
        kind: ClusterSecretStore
      target:
        name: prod-crossview-secrets
        creationPolicy: Owner
      data:
        - secretKey: admin-password
          remoteRef:
            key: prod/devops/crossview
            property: admin-password
        - secretKey: db-password
          remoteRef:
            key: prod/devops/crossview
            property: db-password

  # ---- Kubeconfig ConfigMap (endpoints + CA data only; NO secrets) --------------------
  # Users reference tokenFile paths under /tokens, populated by the refresher.
  # PLACEHOLDER: replace C1_ENDPOINT / C2_ENDPOINT / C3_ENDPOINT and the *_CA_B64 values
  # with the real outputs from multi-cluster/collect-cluster-facts.sh.
  - |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: crossview-kubeconfig
      namespace: crossview
    data:
      config: |
        apiVersion: v1
        kind: Config
        clusters:
          - name: cluster-1
            cluster:
              server: https://C1_ENDPOINT
              certificate-authority-data: C1_CA_B64
          - name: cluster-2
            cluster:
              server: https://C2_ENDPOINT
              certificate-authority-data: C2_CA_B64
          - name: cluster-3
            cluster:
              server: https://C3_ENDPOINT
              certificate-authority-data: C3_CA_B64
        users:
          - name: u1
            user:
              tokenFile: /tokens/c1
          - name: u2
            user:
              tokenFile: /tokens/c2
          - name: u3
            user:
              tokenFile: /tokens/c3
        contexts:
          - name: cluster-1
            context:
              cluster: cluster-1
              user: u1
          - name: cluster-2
            context:
              cluster: cluster-2
              user: u2
          - name: cluster-3
            context:
              cluster: cluster-3
              user: u3
        current-context: cluster-1

  # ---- Token-refresher: ServiceAccount (gets the EKS Pod Identity association) --------
  - |-
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: crossview-token-refresher
      namespace: crossview

  # ---- Token Secret the refresher writes and Crossview mounts -------------------------
  # Argo-safe: the refresher patches this every ~10 min, so tell Argo CD to ignore its
  # data (otherwise the app shows perpetually OutOfSync and may revert the tokens).
  - |-
    apiVersion: v1
    kind: Secret
    metadata:
      name: crossview-remote-tokens
      namespace: crossview
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-options: Prune=false
    type: Opaque

  # ---- RBAC: allow the refresher to patch ONLY that one Secret ------------------------
  - |-
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: crossview-token-writer
      namespace: crossview
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "update", "patch"]
        resourceNames: ["crossview-remote-tokens"]
  - |-
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: crossview-token-writer
      namespace: crossview
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: crossview-token-writer
    subjects:
      - kind: ServiceAccount
        name: crossview-token-refresher
        namespace: crossview

  # ---- Token-refresher Deployment -----------------------------------------------------
  # Uses amazon/aws-cli (has aws + a shell + curl). Mints a token per cluster and PATCHes
  # the Secret via the local Kubernetes REST API with its OWN SA token — no kubectl.
  # PLACEHOLDER: set CLUSTER_1 / CLUSTER_2 / CLUSTER_3 to the real EKS cluster names.
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: crossview-token-refresher
      namespace: crossview
      labels:
        app: crossview-token-refresher
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: crossview-token-refresher
      template:
        metadata:
          labels:
            app: crossview-token-refresher
        spec:
          serviceAccountName: crossview-token-refresher
          containers:
            - name: refresher
              image: amazon/aws-cli:2.15.30
              command: ["/bin/sh", "-c"]
              env:
                - name: AWS_REGION
                  value: us-east-1
                - name: NS
                  value: crossview
                - name: SECRET
                  value: crossview-remote-tokens
                # AWS CLI needs writable HOME/TMP; root fs is read-only so redirect to emptyDirs.
                - name: HOME
                  value: /tmp
                - name: AWS_CONFIG_FILE
                  value: /tmp/aws-config
                - name: AWS_SHARED_CREDENTIALS_FILE
                  value: /tmp/aws-credentials
                - name: TMPDIR
                  value: /tmp
              args:
                - |
                  set -eu
                  API=https://kubernetes.default.svc
                  SATOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  b64() { printf '%s' "$1" | base64 | tr -d '\n'; }
                  patch_secret() {
                    # $1=c1 token, $2=c2 token, $3=c3 token
                    BODY="{\"data\":{\"c1\":\"$(b64 "$1")\",\"c2\":\"$(b64 "$2")\",\"c3\":\"$(b64 "$3")\"}}"
                    curl -sS --cacert "$CACERT" \
                      -H "Authorization: Bearer $SATOKEN" \
                      -H "Content-Type: application/strategic-merge-patch+json" \
                      -X PATCH \
                      "$API/api/v1/namespaces/$NS/secrets/$SECRET" \
                      -d "$BODY" >/dev/null
                  }
                  while true; do
                    T1=$(aws eks get-token --cluster-name CLUSTER_1 --region "$AWS_REGION" | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p')
                    T2=$(aws eks get-token --cluster-name CLUSTER_2 --region "$AWS_REGION" | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p')
                    T3=$(aws eks get-token --cluster-name CLUSTER_3 --region "$AWS_REGION" | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p')
                    if [ -n "$T1" ] && [ -n "$T2" ] && [ -n "$T3" ]; then
                      patch_secret "$T1" "$T2" "$T3" && echo "$(date -u) refreshed tokens"
                    else
                      echo "$(date -u) WARN: empty token (c1=${#T1} c2=${#T2} c3=${#T3})" >&2
                    fi
                    sleep 600
                  done
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}
