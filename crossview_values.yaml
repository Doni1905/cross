# Default values for crossview
# This is a YAML-formatted file.

# Global settings
global:
  namespace: crossview
  createNamespace: true

# Image configuration
image:
  repository: ghcr.io/crossplane-contrib/crossview
  pullPolicy: Always
  tag: ""
  platform: ""

# Application configuration
app:
  name: crossview
  port: 3001
  replicas: 1
  automountServiceAccountToken: null
  # DB_HOST is sourced from the secret prod-crossview-secrets (key: host).
  # The chart always renders a DB_HOST env from the ConfigMap first, then appends
  # everything in app.extraEnv AFTER it. Kubernetes allows duplicate env names and the
  # LAST one wins, so this extraEnv entry overrides the ConfigMap value with the secret
  # value. config.database.host is left empty below so no hostname is baked into the
  # ConfigMap. The `host` key is populated in the secret by the ExternalSecret at the
  # bottom of this file.
  extraEnv:
    - name: DB_HOST
      valueFrom:
        secretKeyRef:
          name: prod-crossview-secrets
          key: host
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

# Deployment strategy
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# Resource limits and requests
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  sessionAffinity: ClientIP
  sessionAffinityTimeout: 10800
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: ://example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API configuration
gatewayAPI:
  enabled: false
  httpRoute:
    apiVersion: gateway.networking.k8s.io/v1
    annotations: {}
    labels: {}
    parentRefs:
      - name: gateway
    hostnames:
      - ://example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database configuration
database:
  enabled: false
  image:
    repository: postgres
    tag: "latest"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# Configuration
config:
  ref: ""
  database:
    enabled: true
    # Leave host empty: the real AWS RDS (Aurora PostgreSQL) CLUSTER WRITER endpoint is
    # injected as the DB_HOST env from the secret via app.extraEnv above (rendered after
    # the ConfigMap DB_HOST, so it wins). Keeping this empty avoids baking the hostname
    # into the crossview-config ConfigMap. The chart falls back to "<release>-postgres"
    # for the ConfigMap value, but that value is overridden at runtime by the secret.
    host: ""
    port: 5432
    database: crossview
    username: crossview
    ssl:
        mode: require
        rootCert: ""
        cert: ""
        key: ""
  server:
    port: 3001
    contextAliases: {}
    auth:
      mode: session
      trustedHeader: X-Auth-User
      createUsers: true
      defaultRole: viewer
    log:
      level: info
    cors:
      origin: http://localhost:5173
      credentials: true
    session:
      cookie:
        secure: false
        httpOnly: true
        maxAge: 86400000

  sso:
    oidc:
      enabled: false
    saml:
      enabled: false

  vite:
    server:
      proxy:
        api:
          target: http://localhost:3001
          changeOrigin: true

# Secrets configuration
secrets:
  adminUsername: "admin"
  adminPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: admin-password
  dbPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: db-password
  # NOTE: the chart has no `dbHost` secret binding, so the host is not set here.
  # DB_HOST is injected from the same secret (key: host) via app.extraEnv above, and the
  # `host` key is populated in prod-crossview-secrets by the ExternalSecret below.

# Service Account
serviceAccount:
  create: true
  name: crossview-sa
  annotations: {}

# RBAC
rbac:
  create: true
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

# Pod affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - crossview
          topologyKey: kubernetes.io/hostname

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

# Extra manifests definition mapping
extraManifests:
  - |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: prod-crossview-secrets
      namespace: crossview
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "1h"
      secretStoreRef:
        name: aws-cluster-secretstore
        kind: ClusterSecretStore
      target:
        name: prod-crossview-secrets
        creationPolicy: Owner
      data:
        - secretKey: admin-password
          remoteRef:
            key: prod/devops/crossview
            property: admin-password
        - secretKey: db-password
          remoteRef:
            key: prod/devops/crossview
            property: db-password
        - secretKey: host
          remoteRef:
            key: prod/devops/crossview
            property: host
