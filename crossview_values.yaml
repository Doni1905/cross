# Default values for crossview
# This is a YAML-formatted file.

# Global settings
global:
  namespace: crossview
  createNamespace: true

# Image configuration
image:
  repository: ghcr.io/crossplane-contrib/crossview
  pullPolicy: Always
  tag: ""
  platform: ""

# Application configuration
app:
  name: crossview
  port: 3001
  replicas: 1
  # TESTING: the in-cluster ServiceAccount token is projected into the pod.
  # Note: when a kubeconfig is also present (KUBECONFIG below), the Kubernetes client
  # typically prefers KUBECONFIG. Having the token mounted does not by itself switch
  # auth modes — it just makes the token available in the pod.
  automountServiceAccountToken: true
  # IMPORTANT: do NOT inject DB_HOST via extraEnv. The chart already renders a
  # DB_HOST env from the ConfigMap; a second DB_HOST here collides on apply
  # ("may not have more than one field specified at a time"). The app consumes the
  # database host through config.database.host below (points at the in-cluster
  # Postgres service deployed by this chart when database.enabled is true).
  extraEnv:
    # Point the Kubernetes client at the kubeconfig file. When set, Crossview
    # reads every context in this file and renders the multi-cluster switcher.
    - name: KUBECONFIG
      value: /etc/crossview/kube/config
  # Kubeconfig is sourced from the prod-crossview-kubeconfig Secret (key: config),
  # mounted read-only at /etc/crossview/kube/config. Nothing sensitive is in this values
  # file, and it works on any node (no hostPath / node access required). For this test the
  # Secret was created manually:
  #   kubectl -n crossview create secret generic prod-crossview-kubeconfig \
  #     --from-file=config=$HOME/.kube/config
  extraVolumes:
    - name: kubeconfig
      secret:
        secretName: prod-crossview-kubeconfig
        items:
          - key: config
            path: config
        defaultMode: 0400
  extraVolumeMounts:
    - name: kubeconfig
      mountPath: /etc/crossview/kube
      readOnly: true
  extraInitContainers: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

# Deployment strategy
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# Resource limits and requests
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Health checks
healthCheck:
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  sessionAffinity: ClientIP
  sessionAffinityTimeout: 10800
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: crossview.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API configuration
gatewayAPI:
  enabled: false
  httpRoute:
    apiVersion: gateway.networking.k8s.io/v1
    annotations: {}
    labels: {}
    parentRefs:
      - name: gateway
    hostnames:
      - crossview.example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Database configuration
database:
  enabled: true
  image:
    repository: postgres
    # Pin a major version. Avoid "latest" for databases: an unplanned major-version
    # bump on a pod restart can break on-disk data/schema compatibility.
    tag: "16"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# Configuration
config:
  ref: ""
  database:
    enabled: true
    # In-cluster Postgres deployed by this chart (database.enabled: true above).
    # This MUST be the Postgres Service name the chart creates. Verify against the
    # chart's service template — common values are "crossview-postgres" or
    # "crossview-db". Update if the chart uses a different name.
    host: "crossview-postgres"
    port: 5432
    database: crossview
    username: postgres
    ssl:
        mode: disable
        rootCert: ""
        cert: ""
        key: ""
  server:
    port: 3001
    # Short UI labels for long kube context names, shown as badges in the
    # multi-cluster switcher sidebar. Keys are the exact context names from the
    # mounted kubeconfig; values are the labels. Adjust to match your contexts.
    contextAliases: {}
    auth:
      mode: session
      trustedHeader: X-Auth-User
      createUsers: true
      defaultRole: viewer
    log:
      level: info
    cors:
      origin: http://localhost:5173
      credentials: true
    session:
      cookie:
        secure: false
        httpOnly: true
        maxAge: 86400000

  sso:
    oidc:
      enabled: false
    saml:
      enabled: false

  vite:
    server:
      proxy:
        api:
          target: http://localhost:3001
          changeOrigin: true

# Secrets configuration
secrets:
  adminUsername: "admin"
  adminPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: admin-password
  dbPassword:
    secretKeyRef:
      name: prod-crossview-secrets
      key: db-password
  # NOTE: the DB host is not a secret. It is set via config.database.host above
  # (the in-cluster Postgres service name), which the chart renders into the
  # ConfigMap DB_HOST. This secret only supplies db-password / admin-password.
  # Ensure the built-in Postgres is initialized with the same username/password
  # (username: postgres, password: db-password) so the app can authenticate.

# Service Account
# A dedicated ServiceAccount is created for the pod. Its token IS projected into the pod
# (app.automountServiceAccountToken: true above). Bind RBAC to this SA if you want the
# pod to make in-cluster API calls with the token. Note the app still prefers KUBECONFIG
# (hostPath) when that file is present.
serviceAccount:
  create: true
  name: crossview-sa
  annotations: {}

# RBAC
# A ClusterRole and ClusterRoleBinding are created and bound to the crossview-sa
# ServiceAccount, giving the pod in-cluster API permissions via its projected token.
# (The app still prefers KUBECONFIG when that file is present.)
rbac:
  create: true
  clusterRole:
    name: crossview-role
  clusterRoleBinding:
    name: crossview-binding

# Pod affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - crossview
          topologyKey: kubernetes.io/hostname

# Node selector
# No pinning needed: the kubeconfig comes from a Secret, so the pod can run on any node.
nodeSelector: {}

# Tolerations
tolerations: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

# Extra manifests definition mapping
extraManifests:
  - |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: prod-crossview-secrets
      namespace: crossview
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: "1h"
      secretStoreRef:
        name: aws-cluster-secretstore
        kind: ClusterSecretStore
      target:
        name: prod-crossview-secrets
        creationPolicy: Owner
      data:
        - secretKey: admin-password
          remoteRef:
            key: prod/devops/crossview
            property: admin-password
        - secretKey: db-password
          remoteRef:
            key: prod/devops/crossview
            property: db-password
  # Kubeconfig is provided via a hostPath file mount (see app.extraVolumes) — the file
  # lives on the node at /home/crossview/.kube/config, not in a Secret or ConfigMap and
  # not in this values file. No ExternalSecret is needed for the kubeconfig.
